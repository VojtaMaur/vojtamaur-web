<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f7f7;
      --panel: #ffffff;
      --ink: #1d1d1d;
      --muted: #666666;
      --line: #d8d8d8;
      --prime: #15925f;
      --seq1: #d34b4b;
      --seq5: #b97800;
      --seq3: #3976d2;
      --accent: #222222;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
      overflow: hidden;
    }

    .wrap {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      width: 100%;
      height: min(820px, 100vh - 24px);
      min-height: 520px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.045);
    }

    label, .checkGroup, .buttons { min-width: 0; }

    label span, .checkTitle {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    select, input[type="range"], button { width: 100%; }

    select, button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 650;
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
      font-weight: 500;
    }

    input[type="range"] { accent-color: #222; }

    .shapeControl { grid-column: span 2; }
    .rangeControl { grid-column: span 5; }
    .checkGroup { grid-column: span 4; }
    .buttons {
      grid-column: span 1;
      display: block;
    }

    .checks {
      display: flex;
      gap: 8px 12px;
      flex-wrap: wrap;
      align-items: center;
      min-height: 34px;
    }

    .checks label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      cursor: pointer;
    }

    .checks input { accent-color: #222; }

    .stage {
      position: relative;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.015);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 11px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .hud strong { color: var(--ink); font-weight: 700; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 4px; vertical-align: -1px; }
    .prime { background: var(--prime); }
    .s1 { background: var(--seq1); }
    .s5 { background: var(--seq5); }
    .s3 { background: var(--seq3); }

    .tip {
      position: absolute;
      pointer-events: none;
      display: none;
      max-width: 220px;
      padding: 8px 10px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(0,0,0,.13);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.35;
      transform: translate(12px, 12px);
      z-index: 3;
      backdrop-filter: blur(8px);
    }

    .tip b { font-size: 15px; }
    .tip small { color: var(--muted); }

    @media (max-width: 760px) {
      body { padding: 8px; overflow: auto; }
      .wrap { height: auto; min-height: 0; }
      .stage { height: 62vh; min-height: 390px; }
      .controls { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .shapeControl { grid-column: span 3; }
      .rangeControl { grid-column: span 3; }
      .checkGroup { grid-column: span 6; }
      .buttons { grid-column: span 6; }
      .hud { display: block; }
      .legend { justify-content: flex-start; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls" aria-label="Nastavení prvočíselné spirály">
      <label class="shapeControl">
        <span>Tvar teselace</span>
        <select id="shape">
          <option value="hex">hexagony</option>
          <option value="square">čtverce</option>
          <option value="tri">trojúhelníky</option>
        </select>
      </label>

      <label class="rangeControl">
        <span id="radiusLabel">Rozsah: 34 vrstev</span>
        <input id="radius" type="range" min="0" max="150" value="34" />
      </label>


      <div class="checkGroup">
        <span class="checkTitle">Zvýraznění</span>
        <div class="checks">
          <label><input id="showPrimes" type="checkbox" checked /> prvočísla</label>
          <label><input id="showResidues" type="checkbox" /> zbytky mod 6</label>
          <label><input id="showNumbers" type="checkbox" /> čísla</label>
        </div>
      </div>

      <div class="buttons">
        <button id="reset" class="secondary">reset</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="tip" id="tip"></div>
    </div>

    <div class="hud">
      <div id="stats">Připraveno.</div>
      <div class="legend">
        <span><i class="dot prime"></i>prvočíslo</span>
        <span><i class="dot s1"></i>6n+1</span>
        <span><i class="dot s5"></i>6n−1</span>
        <span><i class="dot s3"></i>6n+3</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const stage = document.getElementById('stage');
    const tip = document.getElementById('tip');

    const ui = {
      shape: document.getElementById('shape'),
      radius: document.getElementById('radius'),
      radiusLabel: document.getElementById('radiusLabel'),
      showPrimes: document.getElementById('showPrimes'),
      showResidues: document.getElementById('showResidues'),
      showNumbers: document.getElementById('showNumbers'),
      reset: document.getElementById('reset'),
      stats: document.getElementById('stats')
    };

    const css = getComputedStyle(document.documentElement);
    const palette = {
      bg: '#ffffff',
      cell: '#f3f3f3',
      line: '#d4d4d4',
      ink: '#1d1d1d',
      prime: css.getPropertyValue('--prime').trim()
    };

    const cache = new Map();

    let state = {
      data: null,
      screen: [],
      spatial: new Map(),
      spatialSize: 34,
      visibleCount: 0,
      hovered: null,
      running: false,
      animLayer: 0,
      lastTime: 0,
      raf: null,
      pointer: null,
      transform: null
    };

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const lerp = (a, b, t) => a + (b - a) * t;

    function sieve(limit) {
      const prime = new Uint8Array(limit + 1);
      if (limit >= 2) prime.fill(1, 2);
      prime[0] = 0;
      prime[1] = 0;
      for (let p = 2; p * p <= limit; p++) {
        if (!prime[p]) continue;
        for (let k = p * p; k <= limit; k += p) prime[k] = 0;
      }
      return prime;
    }

    function residueClass(n) {
      const r = n % 6;
      if (r === 1) return '6n+1';
      if (r === 5) return '6n−1';
      if (r === 3) return '6n+3';
      return '';
    }

    function residueColor(n, alpha) {
      const r = n % 6;
      if (r === 1) return `rgba(211, 75, 75, ${alpha})`;
      if (r === 5) return `rgba(185, 120, 0, ${alpha})`;
      if (r === 3) return `rgba(57, 118, 210, ${alpha})`;
      return palette.cell;
    }

    function polygonPath(points) {
      const path = new Path2D();
      path.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) path.lineTo(points[i].x, points[i].y);
      path.closePath();
      return path;
    }

    function boundsFromCells(cells) {
      const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (const c of cells) {
        for (const p of c.points) {
          if (p.x < b.minX) b.minX = p.x;
          if (p.x > b.maxX) b.maxX = p.x;
          if (p.y < b.minY) b.minY = p.y;
          if (p.y > b.maxY) b.maxY = p.y;
        }
      }
      return b;
    }

    function squareSpiral(radius) {
      const cells = [];
      let order = 0;
      pushSquare(cells, 1, 0, 0, 0, order++);

      for (let ring = 1; ring <= radius; ring++) {
        let value = 1;
        pushSquare(cells, value++, 0, -ring, ring, order++);

        for (let x = 1; x <= ring; x++) pushSquare(cells, value++, x, -ring, ring, order++);
        for (let y = -ring + 1; y <= ring; y++) pushSquare(cells, value++, ring, y, ring, order++);
        for (let x = ring - 1; x >= -ring; x--) pushSquare(cells, value++, x, ring, ring, order++);
        for (let y = ring - 1; y >= -ring; y--) pushSquare(cells, value++, -ring, y, ring, order++);
        for (let x = -ring + 1; x <= -1; x++) pushSquare(cells, value++, x, -ring, ring, order++);
      }

      return cells;
    }

    function pushSquare(cells, n, x, y, layer, order) {
      const h = 0.5;
      cells.push({
        n,
        layer,
        order,
        cx: x,
        cy: y,
        points: [
          {x: x - h, y: y - h}, {x: x + h, y: y - h},
          {x: x + h, y: y + h}, {x: x - h, y: y + h}
        ]
      });
    }

    function hexSpiral(radius) {
      const cells = [];
      let order = 0;
      pushHex(cells, 1, 0, 0, 0, order++);
      const dirs = [[1,0], [0,1], [-1,1], [-1,0], [0,-1], [1,-1]];

      for (let ring = 1; ring <= radius; ring++) {
        let q = 0;
        let r = -ring;
        let value = 1;

        for (let side = 0; side < 6; side++) {
          for (let step = 0; step < ring; step++) {
            pushHex(cells, value++, q, r, ring, order++);
            q += dirs[side][0];
            r += dirs[side][1];
          }
        }
      }
      return cells;
    }

    function pushHex(cells, n, q, r, layer, order) {
      const size = 0.58;
      const cx = size * 1.5 * q;
      const cy = size * Math.sqrt(3) * (r + q / 2);
      const points = [];
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 180 * (60 * i);
        points.push({ x: cx + size * Math.cos(a), y: cy + size * Math.sin(a) });
      }
      cells.push({ n, layer, order, cx, cy, points });
    }

    function triSpiral(radius) {
      const cells = [];
      const h = Math.sqrt(3) / 2;
      const R = radius;
      let order = 0;

      function makeTri(row, col) {
        const x = (col - row) * 0.5;
        const y = row * h;
        const up = (col % 2) === 0;
        const points = up
          ? [
              { x, y },
              { x: x + 0.5, y: y + h },
              { x: x - 0.5, y: y + h }
            ]
          : [
              { x: x - 0.5, y },
              { x: x + 0.5, y },
              { x, y: y + h }
            ];

        const cx = (points[0].x + points[1].x + points[2].x) / 3;
        const cy = (points[0].y + points[1].y + points[2].y) / 3;
        return { cx, cy, points };
      }

      function add(value, row, col, ring) {
        const cell = makeTri(row, col);
        cells.push({
          n: value,
          layer: order + 1,
          ring,
          order: order++,
          cx: cell.cx,
          cy: cell.cy,
          points: cell.points
        });
      }

      add(1, R, R, 0);

      for (let ring = 1; ring <= R; ring++) {
        const top = R - ring;
        const left = R - ring;
        const bottom = R + ring;
        let value = 1;

        add(value++, top, left, ring);

        for (let row = top + 1; row < bottom; row++) {
          add(value++, row, left + 2 * (row - top), ring);
        }

        for (let col = left + 4 * ring; col >= left; col--) {
          add(value++, bottom, col, ring);
        }

        for (let row = bottom - 1; row > top; row--) {
          add(value++, row, left, ring);
        }
      }

      return cells;
    }

    function buildCells(shape, radius) {
      if (shape === 'square') return squareSpiral(radius);
      if (shape === 'tri') return triSpiral(radius);
      return hexSpiral(radius);
    }

    function getData(shape, radius) {
      const key = `${shape}:${radius}`;
      const hit = cache.get(key);
      if (hit) return hit;

      const cells = buildCells(shape, radius);
      const max = cells.reduce((m, c) => Math.max(m, c.n), 0);
      const primes = sieve(max);
      const bounds = boundsFromCells(cells);
      let layerEnd;
      let revealMax;

      if (shape === 'tri') {
        revealMax = cells.length;
        layerEnd = new Uint32Array(cells.length + 1);
        for (let i = 0; i <= cells.length; i++) layerEnd[i] = i;
      } else {
        revealMax = radius;
        layerEnd = new Uint32Array(radius + 1);
        let cursor = 0;
        for (let layer = 0; layer <= radius; layer++) {
          while (cursor < cells.length && cells[cursor].layer <= layer) cursor++;
          layerEnd[layer] = cursor;
        }
      }

      const data = { shape, radius, cells, max, primes, bounds, layerEnd, revealMax };
      cache.set(key, data);
      return data;
    }

    function fitTransform(bounds) {
      const rect = canvas.getBoundingClientRect();
      const pad = 22;
      const w = Math.max(0.001, bounds.maxX - bounds.minX);
      const h = Math.max(0.001, bounds.maxY - bounds.minY);
      const s = Math.min((rect.width - pad * 2) / w, (rect.height - pad * 2) / h);
      const tx = pad + (rect.width - pad * 2 - w * s) / 2 - bounds.minX * s;
      const ty = pad + (rect.height - pad * 2 - h * s) / 2 - bounds.minY * s;
      return { s, tx, ty, rect };
    }

    function rebuildScreenGeometry() {
      if (!state.data) return;
      const tf = fitTransform(state.data.bounds);
      state.transform = tf;
      state.screen = state.data.cells.map((c, index) => {
        const points = c.points.map(p => ({ x: p.x * tf.s + tf.tx, y: p.y * tf.s + tf.ty }));
        return {
          index,
          n: c.n,
          layer: c.layer,
          sx: c.cx * tf.s + tf.tx,
          sy: c.cy * tf.s + tf.ty,
          points,
          path: polygonPath(points)
        };
      });
      buildSpatialIndex();
    }

    function buildSpatialIndex() {
      state.spatial.clear();
      const size = state.spatialSize;
      for (const c of state.screen) {
        const gx = Math.floor(c.sx / size);
        const gy = Math.floor(c.sy / size);
        const key = `${gx},${gy}`;
        let list = state.spatial.get(key);
        if (!list) state.spatial.set(key, list = []);
        list.push(c);
      }
    }

    function pointInPoly(x, y, points) {
      let inside = false;
      for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
        const xi = points[i].x, yi = points[i].y;
        const xj = points[j].x, yj = points[j].y;
        const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function insetPoints(points, cx, cy, f) {
      return points.map(p => ({ x: lerp(cx, p.x, f), y: lerp(cy, p.y, f) }));
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.fillStyle = palette.bg;
      ctx.fillRect(0, 0, rect.width, rect.height);

      if (!state.data || !state.screen.length) return;

      const tf = state.transform;
      const count = state.visibleCount;
      const tiny = tf.s < 6;
      const showLabels = ui.showNumbers.checked && tf.s > 11;
      const strokeCells = tf.s > 3.2;
      const residueAlpha = tiny ? 0.72 : 0.56;

      for (let i = 0; i < count; i++) {
        const c = state.screen[i];
        ctx.fillStyle = ui.showResidues.checked ? residueColor(c.n, residueAlpha) : palette.cell;
        ctx.fill(c.path);
        if (strokeCells) {
          ctx.strokeStyle = c === state.hovered ? '#000000' : palette.line;
          ctx.lineWidth = c === state.hovered ? 1.25 : 0.55;
          ctx.stroke(c.path);
        }
      }

      if (ui.showPrimes.checked) {
        ctx.fillStyle = palette.prime;
        for (let i = 0; i < count; i++) {
          const c = state.screen[i];
          if (!state.data.primes[c.n]) continue;
          ctx.fill(c.path);
        }
      }

      if (showLabels) {
        ctx.fillStyle = palette.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${clamp(tf.s * 0.28, 8, 12)}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
        for (let i = 0; i < count; i++) {
          const c = state.screen[i];
          if (c.n > 9999 && tf.s < 25) continue;
          ctx.fillText(String(c.n), c.sx, c.sy);
        }
      }

      if (state.hovered && state.hovered.index < count) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke(state.hovered.path);
      }
    }

    function updateStats() {
      const data = state.data;
      let primeCount = 0;
      for (const cell of data.cells) if (data.primes[cell.n]) primeCount++;
      const density = data.cells.length ? (primeCount / data.cells.length * 100).toFixed(2).replace('.', ',') : '0';
      const shapeName = ui.shape.options[ui.shape.selectedIndex].text;
      ui.stats.innerHTML = `<strong>${shapeName}</strong>: ${data.cells.length.toLocaleString('cs-CZ')} buněk, rozsah do <strong>${data.max.toLocaleString('cs-CZ')}</strong>, prvočíselných buněk <strong>${primeCount.toLocaleString('cs-CZ')}</strong> (${density} %).`;
    }

    function setVisibleByLayer(layer) {
      const limit = state.data.revealMax;
      const l = clamp(Math.floor(layer), 0, limit);
      state.visibleCount = state.data.layerEnd[l];
    }

    function rebuildData() {
      const shape = ui.shape.value;
      const radius = Number(ui.radius.value);
      ui.radiusLabel.textContent = `Rozsah: ${radius} vrstev`;
      state.data = getData(shape, radius);
      state.hovered = null;
      state.animLayer = state.data.revealMax;
      state.visibleCount = state.data.cells.length;
      rebuildScreenGeometry();
      updateStats();
      draw();
    }

    function resizeCanvas() {
      const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      const rect = stage.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuildScreenGeometry();
      draw();
    }

    function animate(time) {
      if (!state.running) return;
      const limit = state.data.revealMax;
      const speed = Number(ui.speed.value);
      const stepSpeed = state.data.shape === 'tri' ? speed * 30 : speed;
      if (!state.lastTime) state.lastTime = time;
      const dt = Math.min(80, time - state.lastTime) / 1000;
      state.lastTime = time;

      state.animLayer += dt * stepSpeed;
      if (state.animLayer > limit + 0.8) state.animLayer = 0;
      setVisibleByLayer(state.animLayer);
      draw();
      state.raf = requestAnimationFrame(animate);
    }

    function setRunning(value) {
      state.running = value;
      ui.play.textContent = value ? 'pauza' : 'animace';
      if (value) {
        state.lastTime = 0;
        state.animLayer = 0;
        setVisibleByLayer(0);
        draw();
        state.raf = requestAnimationFrame(animate);
      } else {
        if (state.raf) cancelAnimationFrame(state.raf);
        state.raf = null;
        state.animLayer = state.data.revealMax;
        state.visibleCount = state.data.cells.length;
        draw();
      }
    }

    function findCellAt(x, y) {
      if (!state.data) return null;
      const size = state.spatialSize;
      const gx = Math.floor(x / size);
      const gy = Math.floor(y / size);
      let best = null;
      let bestD = Infinity;
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const list = state.spatial.get(`${gx + ox},${gy + oy}`);
          if (!list) continue;
          for (const c of list) {
            if (c.index >= state.visibleCount) continue;
            const dx = c.sx - x;
            const dy = c.sy - y;
            const d = dx * dx + dy * dy;
            if (d < bestD && pointInPoly(x, y, c.points)) {
              bestD = d;
              best = c;
            }
          }
        }
      }
      return best;
    }

    function showTip(c, ev) {
      if (!c) {
        tip.style.display = 'none';
        return;
      }
      const res = residueClass(c.n);
      const prime = state.data.primes[c.n];
      const type = c.n === 1 ? 'není prvočíslo' : prime ? 'prvočíslo' : 'složené číslo';
      tip.innerHTML = `<b>${c.n.toLocaleString('cs-CZ')}</b><br><small>${type}${res ? ` · ${res}` : ''}</small>`;
      tip.style.left = `${ev.clientX - stage.getBoundingClientRect().left}px`;
      tip.style.top = `${ev.clientY - stage.getBoundingClientRect().top}px`;
      tip.style.display = 'block';
    }

    let hoverRAF = null;
    stage.addEventListener('mousemove', ev => {
      state.pointer = ev;
      if (hoverRAF) return;
      hoverRAF = requestAnimationFrame(() => {
        hoverRAF = null;
        const rect = canvas.getBoundingClientRect();
        const x = state.pointer.clientX - rect.left;
        const y = state.pointer.clientY - rect.top;
        const c = findCellAt(x, y);
        if (c !== state.hovered) {
          state.hovered = c;
          draw();
        }
        showTip(c, state.pointer);
      });
    });

    stage.addEventListener('mouseleave', () => {
      state.hovered = null;
      tip.style.display = 'none';
      draw();
    });

    function stopAndRebuild() {
      rebuildData();
    }

    ui.shape.addEventListener('change', stopAndRebuild);
    ui.radius.addEventListener('input', stopAndRebuild);
    ui.showPrimes.addEventListener('change', draw);
    ui.showResidues.addEventListener('change', draw);
    ui.showNumbers.addEventListener('change', draw);
    ui.reset.addEventListener('click', () => {
      ui.shape.value = 'hex';
      ui.radius.value = 34;
      ui.showPrimes.checked = true;
      ui.showResidues.checked = false;
      ui.showNumbers.checked = false;
      rebuildData();
    });

    const ro = new ResizeObserver(resizeCanvas);
    ro.observe(stage);
    rebuildData();
    resizeCanvas();
  </script>
</body>
</html>
