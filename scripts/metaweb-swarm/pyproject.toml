[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "metaweb-swarm"
version = "0.8.4"
description = "Auditable, isolated Metaweb research swarm"
requires-python = ">=3.11"
dependencies = ["pypdf==6.20.1"]

[project.scripts]
metaweb-swarm = "metaweb_swarm.cli:main"

[project.optional-dependencies]
openai = ["openai-agents==0.23.1", "openai==3.24.0", "pydantic==2.13.5", "cbor2==6.1.5"]

[tool.setuptools.packages.find]
include = ["metaweb_swarm*"]

[tool.setuptools.data-files]
"share/metaweb-swarm" = ["config.prototype.json", "run-prototype.cmd", "config.deposit-trial.json", "run-deposit-trial.cmd", "config.json", "config.research.json", "config.smoke.json", "config.http.json", "README.md", "VALIDATION.md", "run-smoke.cmd", "run-http.cmd", "config.http-smoke.json", "run-http-smoke.cmd", "config.http-public-smoke.json", "run-http-public-smoke.cmd"]
