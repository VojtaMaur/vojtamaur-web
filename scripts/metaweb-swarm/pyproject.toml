[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "metaweb-swarm"
version = "0.6.18"
description = "Auditable, isolated Metaweb research swarm"
requires-python = ">=3.11"
dependencies = ["pypdf==6.20.1"]

[project.scripts]
metaweb-swarm = "metaweb_swarm.cli:main"

[project.optional-dependencies]
openai = ["openai-agents==0.23.1", "openai==3.24.0", "pydantic==2.13.5"]

[tool.setuptools.packages.find]
include = ["metaweb_swarm*"]

[tool.setuptools.data-files]
"share/metaweb-swarm" = ["config.deposit-trial.json", "run-deposit-trial.cmd", "config.json", "config.research.json", "config.smoke.json", "config.http.json", "README.md", "VALIDATION.md", "run-smoke.cmd", "run-http.cmd", "config.http-smoke.json", "run-http-smoke.cmd", "config.http-public-smoke.json", "run-http-public-smoke.cmd"]
"share/metaweb-swarm/docs" = ["docs/PROTOTYPE_WORKFLOW.md", "docs/PAYLOAD_AND_REVIEW_FACTS.md", "docs/REVISION_AND_REPORT.md", "docs/PROTOTYPE_DEBUG.md", "docs/PROTOTYPING_GUIDE.md", "docs/PROTOTYPE_REVIEW.md", "docs/RESEARCH_HANDOFFS.md", "docs/REVIEW_TASKS.md", "docs/STRUCTURED_BINDINGS.md", "docs/PLAN_EDITS.md", "docs/PROMPT_PREFLIGHT.md", "docs/PLAN_RECOVERY.md", "docs/PDF_DOCUMENTS.md", "docs/DISCOVERY_LEADS.md", "docs/CARRIER_SCOPE.md", "docs/DEPOSIT_EXECUTOR.md", "docs/SHARED_AUDIT.md", "docs/FOCUSED_TASKS.md", "docs/DEPOSIT_QUALIFICATION.md", "docs/RUN_REVIEW_20261008_091804.md", "docs/DEPOSIT_TRIAL.md", "docs/HTTP_PUBLIC_SMOKE.md", "docs/HTTP_SMOKE.md", "docs/HTTP_ACCESS.md", "docs/DOCKER_SETUP.md", "docs/EXECUTION_MODES.md", "docs/PROJECT_PROGRESS.md", "docs/START_HERE.md", "docs/RUN_REVIEW_20261007.md", "docs/PACKAGES.md", "docs/GENERATION_MEMORY.md", "docs/RUN_REVIEW_20261007_071555.md", "docs/RUN_REVIEW_20261007_080652.md", "docs/CANDIDATES_AND_SMOKE.md", "docs/RUN_REVIEW_20261007_093936.md", "docs/RUN_REVIEW_20261007_102933.md", "docs/RUN_REVIEW_20261007_104559.md"]
"share/metaweb-swarm/docs/validation" = ["docs/validation/PROTOTYPE_WORKFLOW_SOURCE.txt", "docs/validation/PROTOTYPE_WORKFLOW_DOCKER.json", "docs/validation/PAYLOAD_FACTS_PROOF.json", "docs/validation/AUDIT_QUALIFICATION_FINAL.log", "docs/validation/AUDIT_QUALIFICATION_REGRESSIONS.log", "docs/validation/FOCUSED_TASKING_TARGETED.log", "docs/validation/FOCUSED_TASKING_REGRESSIONS.log", "docs/validation/DEPOSIT_QUALIFICATION_FOCUSED.log", "docs/validation/DEPOSIT_QUALIFICATION_REGRESSIONS.log", "docs/validation/HTTP_INPUT_CONTEXT_TESTS.log", "docs/validation/HTTP_USE_CONTEXT_TESTS.log", "docs/validation/HTTP_DIAGNOSTIC_REGRESSIONS.log", "docs/validation/HTTP_DOC_DIAGNOSTIC_PROOF.json", "docs/validation/HTTP_PUBLIC_PREFLIGHT.json", "docs/validation/HTTP_PUBLIC_PREFLIGHT.log", "docs/validation/HTTP_PUBLIC_SMOKE_REGRESSIONS.log", "docs/validation/HTTP_SMOKE_REGRESSIONS.log", "docs/validation/HTTP_FINAL_REGRESSIONS.log", "docs/validation/HTTP_FOCUSED_FINAL.log", "docs/validation/HTTP_PUBLIC_GET.json", "docs/validation/REGRESSIONS.log", "docs/validation/MODEL_TIERS.log", "docs/validation/SANDBOX_LAUNCHER.log", "docs/validation/SUPERVISED_LAUNCHER.log", "docs/validation/PIP_DOCKER.log", "docs/validation/PIP_DOCKER_INSTALL.json", "docs/validation/PIP_DOCKER_EXPERIMENT.json", "docs/validation/PIP_DOCKER_REOPEN.json", "docs/validation/PIP_REGRESSIONS.log", "docs/validation/GENERATION_REPLAY.json", "docs/validation/GENERATION_FOCUSED.log", "docs/validation/GENERATION_REGRESSIONS.log", "docs/validation/CANDIDATE_REGRESSIONS.log", "docs/validation/CANDIDATE_GATE_FINAL.log", "docs/validation/CANDIDATE_FOCUSED.log", "docs/validation/SDK_DOCKER_CHAIN.json", "docs/validation/SDK_DOCKER_CHAIN.log", "docs/validation/BIND_REGRESSIONS.log", "docs/validation/BIND_PACKAGE_FOCUSED.log", "docs/validation/BIND_SDK_DOCKER.json", "docs/validation/BIND_SDK_DOCKER.log"]
"share/metaweb-swarm/examples" = ["examples/rs_recovery.py"]
"share/metaweb-swarm/context" = ["context/CORE.md", "context/CURRENT_STATE.md", "context/USER_NOTES.md", "context/REJECTED_IDEAS.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
